name: doco-backend

services:
  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    ports:
      - "${CHAT_SERVICE_PORT:-8000}:8000"
    depends_on:
      document-service:
        condition: service_healthy
      llama-server:
        condition: service_healthy
      alloy:
        condition: service_started
    environment:
      CHAT_DATABASE_PATH: "/app/chat-data/chat.db"
      DOCUMENT_GRPC_TARGET: "document-service:50051"
      DOCUMENT_HTTP_BASE_URL: "http://document-service:8001"
      DOCUMENT_GRPC_TIMEOUT_SECONDS: "${DOCUMENT_GRPC_TIMEOUT_SECONDS:-30}"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://llama-server:8080}"
      LLM_COMPLETION_ENDPOINT: "${LLM_COMPLETION_ENDPOINT:-/completion}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-600}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-256}"
      LLM_CHAT_MAX_TOKENS: "${LLM_CHAT_MAX_TOKENS:-1024}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.2}"
      LLAMA_MODEL_FILE: "${LLAMA_MODEL_FILE:-Qwen2.5-3B-Instruct-Q4_K_M.gguf}"
      SERVICE_NAME: "chat-service"
      DEPLOYMENT_ENVIRONMENT: "${DEPLOYMENT_ENVIRONMENT:-local}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      APP_LOG_DEBUG_PAYLOADS: "${APP_LOG_DEBUG_PAYLOADS:-false}"
      APP_LOG_FRONTEND_MESSAGES: "${APP_LOG_FRONTEND_MESSAGES:-true}"
      APP_LOG_LLM_RAW: "${APP_LOG_LLM_RAW:-false}"
      APP_LOG_RESPONSE_BODY: "${APP_LOG_RESPONSE_BODY:-true}"
      APP_LOG_MAX_FIELD_LENGTH: "${APP_LOG_MAX_FIELD_LENGTH:-2000}"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
    volumes:
      - ./data/chat:/app/chat-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  document-service:
    build:
      context: .
      dockerfile: document-service/Dockerfile
    ports:
      - "${DOCUMENT_SERVICE_PORT:-8001}:8001"
      - "127.0.0.1:${DOCUMENT_GRPC_PORT:-50051}:50051"
    depends_on:
      llama-server:
        condition: service_healthy
      alloy:
        condition: service_started
    environment:
      DOCUMENT_DATABASE_PATH: "/app/document-data/documents.db"
      DOCUMENT_GENERATED_DIR: "/app/generated"
      DOCUMENT_GRPC_ADDRESS: "0.0.0.0:50051"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://llama-server:8080}"
      LLM_COMPLETION_ENDPOINT: "${LLM_COMPLETION_ENDPOINT:-/completion}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-600}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-256}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.2}"
      LLAMA_MODEL_FILE: "${LLAMA_MODEL_FILE:-Qwen2.5-3B-Instruct-Q4_K_M.gguf}"
      SERVICE_NAME: "document-service"
      DEPLOYMENT_ENVIRONMENT: "${DEPLOYMENT_ENVIRONMENT:-local}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      APP_LOG_DEBUG_PAYLOADS: "${APP_LOG_DEBUG_PAYLOADS:-false}"
      APP_LOG_FRONTEND_MESSAGES: "${APP_LOG_FRONTEND_MESSAGES:-true}"
      APP_LOG_LLM_RAW: "${APP_LOG_LLM_RAW:-false}"
      APP_LOG_RESPONSE_BODY: "${APP_LOG_RESPONSE_BODY:-true}"
      APP_LOG_MAX_FIELD_LENGTH: "${APP_LOG_MAX_FIELD_LENGTH:-2000}"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
    volumes:
      - ./data/documents:/app/document-data
      - ./generated:/app/generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  llama-server:
    build:
      context: .
      dockerfile: docker/llama.cpp/Dockerfile
      args:
        LLAMA_CPP_REF: "${LLAMA_CPP_REF:-master}"
    environment:
      LLAMA_MODEL_PATH: "${LLAMA_MODEL_PATH:-/models/${LLAMA_MODEL_FILE:-Qwen2.5-3B-Instruct-Q4_K_M.gguf}}"
      LLAMA_HOST: "0.0.0.0"
      LLAMA_PORT: "8080"
      LLAMA_THREADS: "${LLAMA_THREADS:-1}"
      LLAMA_CONTEXT_SIZE: "${LLAMA_CONTEXT_SIZE:-4096}"
      LLAMA_PARALLEL: "${LLAMA_PARALLEL:-1}"
      LLAMA_MAX_TOKENS: "${LLAMA_MAX_TOKENS:-1024}"
      LLAMA_EXTRA_ARGS: "${LLAMA_EXTRA_ARGS:-}"
    volumes:
      - ./models:/models:ro
    ports:
      - "127.0.0.1:${LLAMA_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12345:12345"
    depends_on:
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  grafana-data:
