name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chat-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chat-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chat-service/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: PYTHONPATH=.:../contracts/python python -m pytest -q

  document-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: document-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: document-service/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: PYTHONPATH=.:../contracts/python python -m pytest -q
